[workspace]
authors = ["Guillaume Witz <guillaume.witz@unibe.ch>"]
channels = ["conda-forge"]
name = "DAVPy_env"
platforms = ["osx-arm64", "win-64", "linux-64", "osx-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.13.*"
numpy = ">=2.4.6,<3"
matplotlib = ">=3.10.9,<4"
pandas = ">=3.0.3,<4"
scikit-image = ">=0.26.0,<0.27"
jupyterlab = ">=4.0"
seaborn = ">=0.13.2,<0.14"
openpyxl = ">=3.1.5,<4"
requests = ">=2.34.2,<3"

[feature.advanced.dependencies]
plotnine = "*"
altair = "*"
plotly = "*"
microfilm = "*"
scikit-learn = ">=1.8.0,<2"

[environments]
advanced = ["advanced"]
